<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Radar de E-mails Maliciosos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 20%, rgba(255, 59, 48, 0.12), transparent 35%),
                        radial-gradient(circle at 80% 10%, rgba(255, 99, 71, 0.16), transparent 40%),
                        #0f1115;
            color: #e8e9ee;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }
        .btn-danger {
            background: linear-gradient(90deg, #ff4d4d, #ff1f3d);
            border: none;
            box-shadow: 0 12px 30px rgba(255, 36, 36, 0.35);
        }
        .btn-danger:hover {
            background: linear-gradient(90deg, #ff1f3d, #ff4d4d);
        }
        .section-title {
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.75rem;
            color: #9da3b5;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.35);
            color: #ffc9c9;
            font-size: 0.85rem;
        }
        label {
            color: #cdd1dc;
        }
        .form-control, textarea {
            background: #151821;
            border: 1px solid #1f2431;
            color: #e8e9ee;
        }
        .form-control:focus, textarea:focus {
            border-color: #ff4d4d;
            box-shadow: 0 0 0 0.2rem rgba(255, 77, 77, 0.15);
        }
        .result-card {
            border-left: 4px solid #ff4d4d;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <div class="pill mb-2">
                    <span class="badge bg-danger rounded-pill">Vigilância</span>
                    <span>Monitoramento contínuo de phishing</span>
                </div>
                <h1 class="h3 fw-bold mb-0">Radar de E-mails Maliciosos</h1>
                <p class="text-secondary mb-0" style="color:#9da3b5!important;">Classificação assistida por IA para proteger caixas de entrada.</p>
            </div>
            <div class="text-end d-none d-md-block">
                <div class="section-title">Confiabilidade</div>
                <div class="fw-semibold">LLM Llama 3.3 • Análise contextual</div>
            </div>
        </div>

        <div class="glass rounded-4 p-4 mb-4">
            <div class="section-title mb-3">Submeter e-mail</div>
            <form method="POST" class="grid">
                {% csrf_token %}
                <div>
                    <label class="form-label">Remetente</label>
                    <input type="text" name="remetente" class="form-control" placeholder="ex: alerta@instituicao.com" required>
                </div>
                <div>
                    <label class="form-label">Assunto</label>
                    <input type="text" name="assunto" class="form-control" placeholder="Confirme seus dados agora" required>
                </div>
                <div class="grid" style="grid-template-columns: 1fr;">
                    <label class="form-label mt-3">Corpo do e-mail</label>
                    <textarea name="corpo" class="form-control" rows="6" placeholder="Cole aqui o conteúdo completo" required></textarea>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Analisar e sinalizar</button>
                </div>
            </form>
        </div>

        {% if resultado %}
        <div class="glass rounded-4 p-4 result-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="section-title mb-0">Resultado da análise</div>
                <span class="badge bg-danger text-white">IA</span>
            </div>
            <pre class="mb-0" style="white-space: pre-wrap; color:#e8e9ee; background: transparent; border: none; padding:0;">{{ resultado }}</pre>
        </div>
        {% endif %}
    </div>
</body>
</html>
